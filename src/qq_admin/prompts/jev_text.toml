is_friendly_banter = """
判断这条消息是否属于群内熟人之间轻松、无恶意的开玩笑、玩梗或互相调侃，
而非真正带着恶意的违规行为。
"""

violation_instructions = """
结合近期群聊上下文，判断当前发送者的文字内容是否触犯以下任一安全或群规类别，并选择最准确的一项。
正常技术讨论、日常闲聊、求助提问、无恶意玩笑均应判为 none。
"""

severity_instructions = """
综合消息文本、图片附件与近期上下文，对本次违规的严重程度在 0 到 4 之间打分。
"""

severity_criteria = [
  "0 - 完全正常或友善玩梗，无需任何管理介入",
  "1 - 轻微不当或边缘擦边（如轻度灌水、轻度不道德言论），仅需提醒/警告",
  "2 - 明确违规（如商业广告引流、版权侵犯、明显辱骂骚扰、越狱试探），需要撤回或短时禁言",
  "3 - 严重违规（如非暴力违法、个人身份信息泄露、恶意广告、政治敏感），需要撤回并较长禁言或踢出",
  "4 - 极端高危违规（如暴力血腥、色情内容、自杀与自残诱导、诈骗违法），需要立即撤回并踢出拉黑",
]

[violation_criteria]
