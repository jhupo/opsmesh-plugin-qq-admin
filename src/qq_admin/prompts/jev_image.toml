# TypeSafe Jev image moderation prompts & safety categories.

violation_instructions = """
检查附带的群聊图片，判断是否包含以下任一违规或高危内容，并选择最准确的一项。
正常截图、代码图、生活照、普通表情包应判为 none。
"""

[violation_criteria]
none = "正常图片、截图或普通表情包，无违规"
violence = "暴力或血腥图片：打斗流血、暴力伤害、武器威胁或令人不适的血腥画面"
sexual_content = "色情内容或性行为图片：色情露骨、低俗擦边、裸露或性行为相关画面"
suicide_self_harm = "自杀与自残图片：展示、鼓励或诱导自残/自杀行为的图像"
political_sensitive = "政治敏感图片：包含违规政治标语、敏感人物或涉政宣传的图像"
non_violent_crime = "非暴力违法图片：诈骗返利截图、钓鱼引导图、赌博或黑灰产违法宣传图"
pii = "个人身份信息图片：包含他人身份证、手机号、家庭住址、证件照等敏感隐私截图"
unethical_behavior = "不道德行为图片：人身攻击辱骂图、骚扰挑衅或恶意刷屏低质表情图"
copyright_infringement = "版权侵犯图片：盗版资源网盘截图、破解工具传播或侵权搬运图"
advertising = "广告与引流图片：带二维码、微信号、群号或联系方式的商业广告海报与推广图"
