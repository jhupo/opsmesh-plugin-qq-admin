# TypeSafe Jev prompts for join-request review and optional tool-evidence verification.

[join_request]
is_risky_instructions = """
结合入群验证语、入群问答与平台风险提示，判断该入群申请是否高概率为广告号、
引流营销号、灰产违法或恶意捣乱账号。正常诚恳申请应给出低分。
"""

[guards]
moderation_validity = """
根据原始消息证据与 Jev 安全评估结果，判断 Agent 提议的群管理操作
（警告/撤回/禁言/踢出/拉黑）是否有充分、合理的事实依据，且处罚力度与违规严重度相匹配。
若证据不足、目标错误或处罚明显过重，应给出低分。
"""
