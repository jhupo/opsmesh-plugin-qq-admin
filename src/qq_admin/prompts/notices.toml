# Fallback notices (used only when ReplyAgent is unavailable) and guardrail patterns.

[role_policy]
owner = "Bot 为本群群主：跳过插件侧保护名单与每日限额限制，仍以真实证据与平台接口返回为准。"
admin = "Bot 为本群管理员：严格遵循保护名单、豁免名单、禁言冷却、时长上限、每日配额与处罚阶梯。"
member = "Bot 当前为普通成员：无写管理权限，仅可查询，不得执行写操作。"

[reply_guard]
fake_claim_patterns = [
  '已解禁|已解除\S{0,12}?禁言',
  '已将\S{0,16}?禁言|已把\S{0,16}?禁言|已禁言',
  '已将\S{0,16}?踢出|已把\S{0,16}?踢出|已踢出',
  '已拉黑|已加入黑名单|已移出黑名单',
  '已撤回|已经撤回',
  '已警告|已发出警告',
]
fake_deny_flags = [
  "我没有权限",
  "我不能执行",
  "权限不足",
  "无法禁言",
  "无法踢人",
]
legit_reason_flags = [
  "保护名单",
  "豁免名单",
  "冷却",
  "每日上限",
  "阶梯",
  "失败",
  "拦截",
  "平台",
  "普通成员",
]

[fallback]
denied = "权限不足，无法执行该管理命令。"
bot_not_admin = "Bot 当前不是本群管理员或群主，无法执行管理操作。"
admin_status = """群 {group_id} 管理状态
Bot 身份：{bot_role}
自动管理：{status}
今日计数：禁言 {mute_count}/{mute_limit}，踢出 {kick_count}/{kick_limit}，入群通过 {approve_count}/{approve_limit}，拒绝 {reject_count}/{reject_limit}"""
admin_on = "已开启群 {group_id} 的自动群管。"
admin_off = "已暂停群 {group_id} 的自动群管。"
config_updated = "已更新群 {group_id} 配置 {target} = {value}。"
invalid_duration = "无法识别的禁言时长：{raw}。"
member_welcome = "欢迎 {member_id} 加入本群，请遵守群规。"
exempt_added = "已将 {member_id} 加入本群豁免名单。"
exempt_removed = "已将 {member_id} 移出本群豁免名单。"
log_empty = "群 {group_id} 暂无群管操作记录。"
log_header = "群 {group_id} 最近 {count} 条操作记录："
warn_done = "已提醒 {member_id}（{category}）：{reason}{extra}"
warn_threshold_hint = "（窗口内已达 {current}/{threshold} 次）"
mute_done = "已禁言 {member_id} {duration}（{reason}）"
unmute_done = "已解除 {member_id} 的禁言。"
kick_done = "已移出 {member_id}（拉黑={blacklist}，{reason}）"
ban_done = "已将 {member_id} 加入群黑名单。"
unban_done = "已将 {member_id} 移出群黑名单。"
recall_done = "已撤回消息 {message_id}。"
approve_done = "已通过入群申请 {request_id}（{member_id}）。"
reject_done = "已拒绝入群申请 {request_id}（{member_id}，{reason}）。"
action_blocked = "操作被护栏拦截：{reason}"
action_failed = "操作执行失败：{reason}"
shutlist_empty = "当前群没有被禁言的成员（全员禁言模式：{mode}）。"
blacklist_empty = "当前群黑名单为空。"
requests_empty = "当前没有待处理的入群申请。"
auto_reject_risk = "触发平台风险提示，自动拒绝"
auto_reject_jev = "入群申请经 Jev 评估风险过高，自动拒绝"
auto_approve_reason = "通过自动入群审核"
