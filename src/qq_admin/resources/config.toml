# Minimal default configuration for opsmesh-plugin-qq-admin.
# Feature modules own their own defaults and only write per-group overrides
# here when customized via /admin commands.

[jev]
api_key = ""
model = "jev-1"
proxy = ""
timeout_seconds = 10.0

[agent]
api_key = ""
base_url = ""
decision_model = "gpt-5-mini"
reply_model = ""
reply_temperature = 0.7
reply_persona = ""
use_chat_completions = false
timeout_seconds = 30.0
max_turns = 6
session_mode = "fresh"
session_db_path = ":memory:"
