name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Build & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install toolchain and run verification
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "opsmesh[fastapi,httpx,websockets] @ git+https://github.com/jhupo/OpsMesh.git@master"
          python -m pip install "opsmesh-adapter-qq @ git+https://github.com/jhupo/opsmesh-adapter-qq.git@master"
          python -m pip install --no-deps -e .
          python -m pip install pytest ruff build twine
          ruff check src tests examples
          ruff format --check src tests examples
          pytest -v
      - name: Build and check distributions
        run: |
          python -m build
          twine check dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
