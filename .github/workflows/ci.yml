name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check (including Bandit S rules)
        run: ruff check src tests examples
      - name: Ruff format check
        run: ruff format --check src tests examples

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "opsmesh[fastapi,httpx,websockets] @ git+https://github.com/jhupo/OpsMesh.git@master"
          python -m pip install "opsmesh-adapter-qq @ git+https://github.com/jhupo/opsmesh-adapter-qq.git@master"
          python -m pip install --no-deps -e .
          python -m pip install pytest
      - name: Run unit tests
        run: pytest -v

  build:
    name: Build & Verify Wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python -m build
          twine check dist/*
      - name: Verify wheel package contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {"qq_admin/__init__.py", "qq_admin/py.typed"}
          missing = required - names
          assert not missing, f"Missing files in wheel: {missing}"
          print(f"Verified {len(names)} files in {wheels[0]}")
          EOF
