name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency Audit & Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install security scanners and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "opsmesh[fastapi,httpx,websockets] @ git+https://github.com/jhupo/OpsMesh.git@master"
          python -m pip install "opsmesh-adapter-qq @ git+https://github.com/jhupo/opsmesh-adapter-qq.git@master"
          python -m pip install --no-deps -e .
          python -m pip install bandit pip-audit ruff
      - name: Ruff security lint (Bandit S rules)
        run: ruff check --select S src
      - name: Bandit static security scan
        run: bandit -r src/qq_admin -ll -ii
      - name: Dependency CVE audit (pip-audit)
        run: pip-audit --skip-editable
